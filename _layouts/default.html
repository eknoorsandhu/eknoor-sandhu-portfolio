<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="{{ site.title }}">
    <meta property="og:title" content="{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/eknoor.jpg">
    <link rel="stylesheet" href="{{ site.baseurl }}/css/main.css">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="{{ site.baseurl }}/favicon_io/site.webmanifest">
  </head>
  <body>
    <header class="site-header">
      <div class="wrap site-header__inner">
        <a class="site-name" href="{{ site.baseurl }}/">Eknoor Kaur Sandhu</a>
        <nav aria-label="Main navigation">
          <ul class="site-nav">
            <li><a href="{{ site.baseurl }}/#about">About</a></li>
            <li><a href="{{ site.baseurl }}/#research">Research</a></li>
            <li><a href="{{ site.baseurl }}/#projects">Projects</a></li>
            <li><a href="{{ site.baseurl }}/#community">Community</a></li>
            <li><a href="{{ site.baseurl }}/#art">Art</a></li>
            <li><a href="{{ site.baseurl }}/Eknoor-Sandhu-Resume.pdf">Resume</a></li>
            <li><a href="{{ site.baseurl }}/#contact">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      {{ content }}
    </main>
    <footer id="contact" class="site-footer">
      <div class="wrap">
        <h2>Get in touch</h2>
        <ul class="footer-links">
          <li><a href="mailto:eknoorksandhu@gmail.com">eknoorksandhu@gmail.com</a></li>
          <li><a href="https://github.com/eknoorsandhu">GitHub</a></li>
          <li><a href="{{ site.baseurl }}/Eknoor-Sandhu-Resume.pdf">Resume (PDF)</a></li>
        </ul>
        <small>Chandigarh, India</small>
      </div>
    </footer>
    <script src="{{ site.baseurl }}/assets/site.js" defer></script>
  </body>
</html>
